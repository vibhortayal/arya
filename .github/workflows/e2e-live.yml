name: e2e-live

# Checks the deployed site the way real users do, with three tester
# accounts (sign-in, group sharing, live sync, privacy between
# households). Manual only, like tests.yml (owner: no run on every PR).
# Start it from the Actions tab with "Run workflow". Needs three repository secrets:
# ARYA_TESTER_A_PASSWORD, ARYA_TESTER_B_PASSWORD, ARYA_TESTER_C_PASSWORD.
# The tester emails default to tester-a@test.arya and so on.
on:
  # TEMPORARY: lets the owner's first run happen on the draft PR before
  # merge. Remove before merging (AGENTS.md: CI is manual-only).
  pull_request:
    paths:
      - "assistant/web/e2e-live/**"
      - ".github/workflows/e2e-live.yml"
  workflow_dispatch:
    inputs:
      base_url:
        description: Site to test
        default: https://arya.teamnightshift.org
      known:
        description: Also run the known-issues checks (1 = yes)
        default: "0"

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One run at a time: the testers share groups and lists.
    concurrency: e2e-live
    defaults:
      run:
        working-directory: assistant/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm i --no-save --no-package-lock playwright@1
      - run: npx playwright install --with-deps chromium
      - run: node e2e-live/run.mjs
        env:
          ARYA_BASE_URL: ${{ inputs.base_url || 'https://arya.teamnightshift.org' }}
          ARYA_LIVE_KNOWN: ${{ inputs.known || '0' }}
          ARYA_TESTER_A_PASSWORD: ${{ secrets.ARYA_TESTER_A_PASSWORD }}
          ARYA_TESTER_B_PASSWORD: ${{ secrets.ARYA_TESTER_B_PASSWORD }}
          ARYA_TESTER_C_PASSWORD: ${{ secrets.ARYA_TESTER_C_PASSWORD }}
