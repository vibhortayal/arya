name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: assistant/api/requirements.txt
      # Some PWA tests run extracted functions with node -e.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r assistant/api/requirements.txt
      - name: Run the suite
        working-directory: assistant
        run: python -m unittest discover -s tests
