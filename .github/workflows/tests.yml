name: tests

# Manual only (owner, 2026-10-29: no test run on every PR). Start it
# from the Actions tab with "Run workflow".
on:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: assistant/api/requirements.txt
      # The scene.js tests run it under node; the web job below needs it too.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r assistant/api/requirements.txt
      - name: Run the suite
        working-directory: assistant
        run: python -m unittest discover -s tests

  # The app (assistant/web): types, the vitest tests and the build.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: assistant/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: assistant/web/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run
      - run: npm run build
