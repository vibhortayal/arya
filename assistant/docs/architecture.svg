<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 876" width="1000" height="876" role="img" aria-labelledby="ttl">
<title id="ttl">Arya architecture: the app and the Muse agent talk to Caddy and one FastAPI server. Code does money and timing. Meta models read photos and answer questions. State sits in files, Postgres, or both.</title>
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555"/></marker></defs>
<style>
text{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif}
.bg{fill:#fff} .band{fill:#f6f7f9;stroke:#d8dbe0} .bl{font-size:13px;font-weight:700;fill:#555b64}
.b{fill:#fff;stroke:#9aa1ab} .g{fill:#e9f6ee;stroke:#2f8f57} .o{fill:#fff1ea;stroke:#e4572e} .p{fill:#eef0fb;stroke:#5b64c9} .y{fill:#fff8e1;stroke:#c9a227}
.t{font-weight:700;font-size:15px;fill:#1c1c1e} .s{font-size:13px;fill:#3c3c43} .ar{stroke:#555;stroke-width:1.6;fill:none} .al{font-size:12px;fill:#555}
.ttl{font-size:24px;font-weight:700;fill:#1c1c1e} .sub{font-size:14px;fill:#555}
@media (prefers-color-scheme:dark){.bg{fill:#0d0d0f}.band{fill:#17181b;stroke:#34363b}.bl{fill:#a0a4ab}.b{fill:#1f2024;stroke:#6b7078}.g{fill:#14291d;stroke:#3fae6c}.o{fill:#33201a;stroke:#f08060}.p{fill:#1c1f38;stroke:#8990e6}.y{fill:#2b2510;stroke:#d9b640}.t,.ttl{fill:#f2f2f4}.s,.sub,.al{fill:#c4c7cc}.ar{stroke:#9aa0a8}#h path{fill:#9aa0a8}}
</style>
<rect class="bg" width="1000" height="876"/>
<text class="ttl" x="24" y="36">Arya, as built</text>
<text class="sub" x="24" y="60">One server. Code does the money and the timing. Meta models read photos and answer questions.</text>
<rect class="band" x="20" y="78" width="960" height="122" rx="14"/>
<text class="bl" x="36" y="100">1  You</text>
<rect class="o" x="36" y="112" width="420" height="80" rx="10"/>
<text class="t" x="50" y="136">Arya app (installable web app)</text>
<text class="s" x="50" y="158">React + Vite. Tabs: Today · Spending · Quest · Ask · More</text>
<text class="s" x="50" y="176">Works offline · push reminders · live group sync</text>
<rect class="p" x="474" y="112" width="244" height="80" rx="10"/>
<text class="t" x="488" y="136">Muse agent</text>
<text class="s" x="488" y="158">Any MCP client reads and</text>
<text class="s" x="488" y="176">writes your list</text>
<rect class="b" x="736" y="112" width="228" height="80" rx="10"/>
<text class="t" x="750" y="136">Owner on the VM</text>
<text class="s" x="750" y="158">Daily push (cron)</text>
<text class="s" x="750" y="176">Backup and restore</text>
<rect class="band" x="20" y="220" width="960" height="150" rx="14"/>
<text class="bl" x="36" y="242">2  Server: one VM, Docker Compose</text>
<rect class="b" x="36" y="254" width="200" height="100" rx="10"/>
<text class="t" x="50" y="278">Caddy</text>
<text class="s" x="50" y="300">HTTPS (Let’s Encrypt)</text>
<text class="s" x="50" y="318">Security headers</text>
<text class="s" x="50" y="336">Redirects http to https</text>
<rect class="g" x="262" y="254" width="702" height="100" rx="10"/>
<text class="t" x="276" y="278">FastAPI, one process (api/main.py)</text>
<text class="s" x="276" y="300">Routes, one per area: sign-in and account · receipts and review · lists and items</text>
<text class="s" x="276" y="318">home and Ask · prices · groups · Quest · Muse connector</text>
<text class="s" x="276" y="336">Guards on every request: login or demo sandbox · cost ledger and budget · rate limits</text>
<line class="ar" x1="236" y1="304" x2="262" y2="304" marker-end="url(#h)"/>
<rect class="band" x="20" y="390" width="960" height="130" rx="14"/>
<text class="bl" x="36" y="412">3  Code, no model, $0</text>
<rect class="g" x="36" y="424" width="176" height="80" rx="10"/>
<text class="t" x="50" y="448">Decode + check</text>
<text class="s" x="50" y="470">Lines must add up</text>
<text class="s" x="50" y="488">to the printed total</text>
<rect class="g" x="224" y="424" width="176" height="80" rx="10"/>
<text class="t" x="238" y="448">Ledger + patterns</text>
<text class="s" x="238" y="470">Returns netted,</text>
<text class="s" x="238" y="488">cadence, price by store</text>
<rect class="g" x="412" y="424" width="176" height="80" rx="10"/>
<text class="t" x="426" y="448">List + expiry</text>
<text class="s" x="426" y="470">Self-writing list,</text>
<text class="s" x="426" y="488">running-low rule</text>
<rect class="g" x="600" y="424" width="176" height="80" rx="10"/>
<text class="t" x="614" y="448">Groups + live sync</text>
<text class="s" x="614" y="470">Shared home, invites,</text>
<text class="s" x="614" y="488">live updates</text>
<rect class="g" x="788" y="424" width="176" height="80" rx="10"/>
<text class="t" x="802" y="448">Reminders</text>
<text class="s" x="802" y="470">One push a day</text>
<text class="s" x="802" y="488">at most</text>
<rect class="band" x="20" y="536" width="960" height="148" rx="14"/>
<text class="bl" x="36" y="558">4  Meta models and helpers (every call goes through api/meta_client.py)</text>
<rect class="y" x="36" y="570" width="176" height="104" rx="10"/>
<text class="t" x="50" y="594">Photo reader</text>
<text class="s" x="50" y="616">Spark reads first.</text>
<text class="s" x="50" y="634">Wonder re-reads only</text>
<text class="s" x="50" y="652">a receipt the checks flag</text>
<rect class="y" x="224" y="570" width="176" height="104" rx="10"/>
<text class="t" x="238" y="594">Ask Arya</text>
<text class="s" x="238" y="616">Spark answers over</text>
<text class="s" x="238" y="634">your household snapshot</text>
<rect class="y" x="412" y="570" width="176" height="104" rx="10"/>
<text class="t" x="426" y="594">Staple judge</text>
<text class="s" x="426" y="616">Gates what joins the list;</text>
<text class="s" x="426" y="634">second seat: Spark Open</text>
<rect class="y" x="600" y="570" width="176" height="104" rx="10"/>
<text class="t" x="614" y="594">Quest vision</text>
<text class="s" x="614" y="616">SAM 3.1 finds items,</text>
<text class="s" x="614" y="634">Spark checks each crop</text>
<rect class="y" x="788" y="570" width="176" height="104" rx="10"/>
<text class="t" x="802" y="594">Voice and images</text>
<text class="s" x="802" y="616">Voice transcribe</text>
<text class="s" x="802" y="634">Muse Image</text>
<rect class="band" x="20" y="704" width="960" height="156" rx="14"/>
<text class="bl" x="36" y="726">5  Storage and outside services</text>
<rect class="b" x="36" y="738" width="300" height="112" rx="10"/>
<text class="t" x="50" y="762">Storage (api/state.py)</text>
<text class="s" x="50" y="784">json: files on a Docker volume (default)</text>
<text class="s" x="50" y="802">dual: files stay the truth, mirrored to Postgres</text>
<text class="s" x="50" y="820">pg: Supabase Postgres, schema arya</text>
<rect class="p" x="354" y="738" width="196" height="112" rx="10"/>
<text class="t" x="368" y="762">Sign-in</text>
<text class="s" x="368" y="784">Email code (Supabase)</text>
<text class="s" x="368" y="802">Google: Arya’s own sign-in,</text>
<text class="s" x="368" y="820">or Supabase if not set up</text>
<rect class="p" x="568" y="738" width="196" height="112" rx="10"/>
<text class="t" x="582" y="762">Model hosts</text>
<text class="s" x="582" y="784">Meta Model API:</text>
<text class="s" x="582" y="802">Spark · Wonder · SAM 3.1</text>
<text class="s" x="582" y="820">Baseten: Spark Open</text>
<rect class="b" x="782" y="738" width="182" height="112" rx="10"/>
<text class="t" x="796" y="762">Other</text>
<text class="s" x="796" y="784">Google Places</text>
<text class="s" x="796" y="802">(store search)</text>
<text class="s" x="796" y="820">Web Push (VAPID)</text>
<line class="ar" x1="500" y1="200" x2="500" y2="220" marker-end="url(#h)"/>
<line class="ar" x1="500" y1="370" x2="500" y2="390" marker-end="url(#h)"/>
<line class="ar" x1="500" y1="520" x2="500" y2="536" marker-end="url(#h)"/>
<line class="ar" x1="500" y1="684" x2="500" y2="704" marker-end="url(#h)"/>
</svg>
