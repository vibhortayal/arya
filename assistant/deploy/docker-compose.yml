# The app keeps its data as JSON documents in the arya-data volume, or
# in Supabase Postgres when ARYA_STORE asks for it (DATABASE_URL). There
# is no local database service: the old one here was never read by the
# app (codebase map 2026-10-29). An existing arya-db volume on the VM is
# left in place; remove it by hand only when you are sure it is unused.
# Docker keeps every container's stdout forever by default and a busy
# demo can fill the VM disk. Cap each service at 5 files of 10 MB.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      # /health reports this. Deploy with
      #   GIT_COMMIT=$(git rev-parse --short HEAD) docker compose up -d --build
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    # Come back after a VM reboot or a crash. unless-stopped keeps a
    # deliberate `docker compose stop` stopped.
    restart: unless-stopped
    logging: *default-logging
    environment:
      ARYA_DATA_DIR: /app/data
      ARYA_DEMO_DOOR_RATE: ${ARYA_DEMO_DOOR_RATE:-240}
      ARYA_DEMO_AUTH_RATE: ${ARYA_DEMO_AUTH_RATE:-120}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      BASETEN_API_KEY: ${BASETEN_API_KEY:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      ARYA_OPEN_MODEL: ${ARYA_OPEN_MODEL:-}
      ARYA_STORE: ${ARYA_STORE:-json}
      DATABASE_URL: ${DATABASE_URL:-}
      ARYA_SUPABASE_AUTH: ${ARYA_SUPABASE_AUTH:-0}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      ARYA_SUPABASE_SIGNUP: ${ARYA_SUPABASE_SIGNUP:-1}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ARYA_MAIL_FROM: ${ARYA_MAIL_FROM:-}
      ARYA_MAIL_REPLY_TO: ${ARYA_MAIL_REPLY_TO:-}
      ARYA_PUBLIC_URL: ${ARYA_PUBLIC_URL:-}
      # Switches read by the app. Each default matches the code's own
      # default, so an unset value behaves exactly as before.
      ARYA_PHOTO_READER: ${ARYA_PHOTO_READER:-wonder}
      ARYA_SPARK_TIER: ${ARYA_SPARK_TIER:-contributor}
      ARYA_REGISTRATION_OPEN: ${ARYA_REGISTRATION_OPEN:-0}
      ARYA_OWNER_USERNAME: ${ARYA_OWNER_USERNAME:-}
      ARYA_WAITLIST_ADMINS: ${ARYA_WAITLIST_ADMINS:-}
      ARYA_WAITLIST_IP_RATE: ${ARYA_WAITLIST_IP_RATE:-5}
      ARYA_WAITLIST_MAX: ${ARYA_WAITLIST_MAX:-5000}
      ARYA_DAILY_BUDGET_USD: ${ARYA_DAILY_BUDGET_USD:-10}
      # $20 a day for the judging window (about 50 full demo visits at
      # the $0.40 per-visit cap), paid from the hackathon credits. The
      # app's own default stays $2; put 2 in deploy/.env to go back.
      ARYA_DEMO_DAILY_BUDGET_USD: ${ARYA_DEMO_DAILY_BUDGET_USD:-20}
      ARYA_DEMO_SESSION_BUDGET_USD: ${ARYA_DEMO_SESSION_BUDGET_USD:-0.40}
      ARYA_FEEDBACK_DAILY_CAP: ${ARYA_FEEDBACK_DAILY_CAP:-5}
      ARYA_FEEDBACK_MAIL_CAP: ${ARYA_FEEDBACK_MAIL_CAP:-20}
      # Keeping Arya running: per real account, a month's AI spend that
      # shows a heads-up, a higher one that pauses paid reads until the
      # 1st, and an hour's spend that switches the account's paid reads
      # off for ARYA_USER_FREEZE_HOURS. The owner is exempt. 0 = off.
      ARYA_USER_HEAVY_MONTHLY_USD: ${ARYA_USER_HEAVY_MONTHLY_USD:-3}
      ARYA_USER_MONTHLY_CEILING_USD: ${ARYA_USER_MONTHLY_CEILING_USD:-5}
      ARYA_USER_HOURLY_FREEZE_USD: ${ARYA_USER_HOURLY_FREEZE_USD:-1}
      ARYA_USER_FREEZE_HOURS: ${ARYA_USER_FREEZE_HOURS:-24}
      ARYA_COST_PUBLIC_MIN: ${ARYA_COST_PUBLIC_MIN:-50}
      ARYA_COST_PAID_BY: ${ARYA_COST_PAID_BY:-Hackathon credits}
      # on: an API token may not call the blocked routes (bulk model spend,
      # groups, push, feedback, account export). off lifts that list.
      ARYA_TOKEN_GUARDS: ${ARYA_TOKEN_GUARDS:-on}
      # Ops: where the daily report email goes (python -m harness.ops
      # report --email, see docs/OPS.md) and the free disk below which
      # /health answers 503 so the outside uptime check alerts.
      ARYA_OPS_EMAIL: ${ARYA_OPS_EMAIL:-}
      # Heads-up mail to the owner when a new address joins the waitlist.
      # Falls back to ARYA_OPS_EMAIL; max N mails an hour, then one "paused".
      ARYA_WAITLIST_NOTIFY_EMAIL: ${ARYA_WAITLIST_NOTIFY_EMAIL:-}
      ARYA_WAITLIST_NOTIFY_PER_HOUR: ${ARYA_WAITLIST_NOTIFY_PER_HOUR:-10}
      ARYA_HEALTH_MIN_FREE_MB: ${ARYA_HEALTH_MIN_FREE_MB:-500}
      ARYA_PUSH_REMINDERS: ${ARYA_PUSH_REMINDERS:-0}
      ARYA_GROUPS: ${ARYA_GROUPS:-1}
      ARYA_DEMO_TOWN: ${ARYA_DEMO_TOWN:-0}
      ARYA_LIVE_PG: ${ARYA_LIVE_PG:-1}
      ARYA_SUGGEST_GUESSES: ${ARYA_SUGGEST_GUESSES:-1}
      ARYA_SUGGEST_GUESS_CAP: ${ARYA_SUGGEST_GUESS_CAP:-40}
      ARYA_SUGGEST_MIN_HOUSEHOLDS: ${ARYA_SUGGEST_MIN_HOUSEHOLDS:-3}
      ARYA_VAPID_PUBLIC_KEY: ${ARYA_VAPID_PUBLIC_KEY:-}
      ARYA_VAPID_PRIVATE_KEY: ${ARYA_VAPID_PRIVATE_KEY:-}
      ARYA_VAPID_SUBJECT: ${ARYA_VAPID_SUBJECT:-mailto:admin@example.com}
      ARYA_SCAN_DAILY_FRAMES: ${ARYA_SCAN_DAILY_FRAMES:-120}
      ARYA_KROGER_AISLES: ${ARYA_KROGER_AISLES:-0}
      ARYA_KROGER_DAILY_CALLS: ${ARYA_KROGER_DAILY_CALLS:-800}
      KROGER_CLIENT_ID: ${KROGER_CLIENT_ID:-}
      KROGER_CLIENT_SECRET: ${KROGER_CLIENT_SECRET:-}
    volumes:
      - arya-data:/app/data
      # The nightly backups, read only, so the Ops screen can show the
      # age of the newest one. backup.sh writes to ~/arya-backups.
      - /home/ubuntu/arya-backups:/backups:ro
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
      - "8081:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Owner concept pages, served at /p/ (see Caddyfile). VM-only
      # directory: files are dropped in by hand, never committed.
      - /home/ubuntu/arya-pages:/srv/pages:ro
    depends_on:
      - api
volumes:
  arya-data:
