services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: arya
      POSTGRES_USER: arya
    volumes:
      - arya-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arya"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      ARYA_DATA_DIR: /app/data
      ARYA_DEMO_DOOR_RATE: ${ARYA_DEMO_DOOR_RATE:-240}
      ARYA_DEMO_AUTH_RATE: ${ARYA_DEMO_AUTH_RATE:-120}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      BASETEN_API_KEY: ${BASETEN_API_KEY:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      ARYA_OPEN_MODEL: ${ARYA_OPEN_MODEL:-}
      ARYA_STORE: ${ARYA_STORE:-json}
      DATABASE_URL: ${DATABASE_URL:-}
      ARYA_SUPABASE_AUTH: ${ARYA_SUPABASE_AUTH:-0}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      ARYA_SUPABASE_SIGNUP: ${ARYA_SUPABASE_SIGNUP:-1}
    volumes:
      - arya-data:/app/data
    depends_on:
      db:
        condition: service_healthy
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "8081:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
volumes:
  arya-db:
  arya-data:
