<title>Arya Quest Game Flow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a phone on the left that you tap through; the right rail names the screen, says why it exists, and lets you jump. */
:root {
  --page: #E6E6EA; --ink: #1B1B1E; --ink2: #45454B; --ink3: #6B6B72;
  --panel: #FFFFFF; --bg: #EFEFF1; --fill: #D7D7DC; --line: #DADADF;
  --acc: #E4572E; --acc-ink: #B8401D; --acc-soft: #FDEEE8; --ok: #2F8F5B;
  --font: -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #141416; color-scheme: dark; } }
:root[data-theme="dark"] { --page: #141416; color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--page); color: var(--ink); font-family: var(--font); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px; box-sizing: border-box; }
.wrap { display: flex; gap: 28px; justify-content: center; align-items: flex-start; flex-wrap: wrap; }
.phone { width: 100%; max-width: 390px; aspect-ratio: 390 / 800; background: var(--bg); border-radius: 34px; box-shadow: 0 0 0 10px #1B1B1E, 0 20px 50px rgba(0,0,0,.25); overflow: hidden; position: relative; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 9px; padding: 40px 14px 14px; overflow-y: auto; overflow-x: hidden; }
.rail { flex: 1 1 300px; max-width: 420px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.card-rail { background: var(--panel); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.rail h1 { margin: 0; font-size: 22px; text-wrap: balance; }
.rail .why { margin: 0; color: var(--ink2); font-size: 14px; line-height: 1.5; }
.eyebrow { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); }
.flow { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.flow button { text-align: left; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 10px; padding: 7px 9px; font: 13px var(--font); cursor: pointer; }
.flow button.on { border-color: var(--acc); background: var(--acc-soft); font-weight: 700; }
.flow .grp { grid-column: 1 / -1; margin: 6px 0 0; }
.new { font-size: 10px; font-weight: 800; color: #fff; background: var(--acc); border-radius: 6px; padding: 1px 5px; margin-left: 4px; }
.navrow { display: flex; gap: 8px; }
.navrow button { flex: 1; }

/* in-phone UI */
.hud { display: flex; align-items: center; gap: 6px; }
.chip { background: var(--panel); border-radius: 999px; padding: 7px 11px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.chip.grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.chip.pts { color: var(--acc-ink); font-weight: 800; }
.chip.cnt { background: var(--acc); color: #fff; font-weight: 700; }
.round { width: 34px; height: 34px; border-radius: 999px; background: var(--panel); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; border: 0; color: var(--ink); cursor: pointer; }
.view { border-radius: 18px; background: linear-gradient(160deg, #CFCFD5, #BDBDC4); position: relative; height: 210px; flex-shrink: 0; overflow: hidden; }
.view .lbl { position: absolute; left: 12px; bottom: 10px; font-size: 12px; font-weight: 600; color: var(--ink2); background: rgba(255,255,255,.8); border-radius: 8px; padding: 3px 7px; }
.shelves { position: absolute; inset: 18px 14px 40px; display: flex; flex-direction: column; justify-content: space-between; }
.shelves i { display: block; height: 22%; border-bottom: 4px solid rgba(0,0,0,.18); background: repeating-linear-gradient(90deg, rgba(255,255,255,.45) 0 14px, rgba(0,0,0,.06) 14px 22px); border-radius: 3px; }
.dot { position: absolute; width: 28px; height: 28px; border-radius: 999px; background: var(--acc); color: #fff; border: 3px solid #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; }
.cap { margin: 0; font-size: 12.5px; color: var(--ink2); display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.link { color: var(--acc-ink); font-weight: 700; background: none; border: 0; padding: 0; font: 700 13px var(--font); cursor: pointer; white-space: nowrap; }
.tools { display: flex; gap: 6px; }
.tool { flex: 1; background: var(--panel); border-radius: 12px; padding: 9px 4px; font: 600 13px var(--font); text-align: center; border: 0; color: var(--ink); cursor: pointer; }
.tool.sq { flex: 0 0 38px; }
.next { background: var(--panel); border: 2px solid var(--acc); border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.next .k { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--acc-ink); text-transform: uppercase; }
.next h2 { margin: 0; font-size: 20px; }
.next .shelf { margin: -4px 0 0; font-size: 13px; color: var(--ink3); }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 14px; font: 700 17px var(--font); border: 0; cursor: pointer; width: 100%; }
.btn.primary { background: var(--acc); color: #fff; }
.btn.ghost { background: var(--panel); color: var(--ink); border: 1.5px solid var(--line); min-height: 46px; font-size: 15px; }
.btn.hot { box-shadow: 0 0 0 3px var(--acc-soft), 0 0 0 5px var(--acc); }
.fresh { border-radius: 12px; overflow: hidden; position: relative; height: 104px; background: linear-gradient(170deg, #C9C9CF, #B3B3BA); }
.fresh .box { position: absolute; left: 52%; top: 22%; width: 22%; height: 52%; border: 3px solid var(--acc); border-radius: 8px; box-shadow: 0 0 0 999px rgba(0,0,0,.28); }
.blur { position: absolute; left: 6%; top: 8%; width: 18%; height: 84%; border-radius: 8px; background: repeating-conic-gradient(#A9A9B0 0 25%, #C2C2C8 0 50%) 0 0 / 14px 14px; }
.small { margin: 0; font-size: 12px; color: var(--ink3); line-height: 1.4; }
.list { background: var(--panel); border-radius: 14px; }
.row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; font-size: 14px; font-weight: 600; }
.row + .row { border-top: 1px solid var(--bg); }
.row .ck { width: 18px; color: var(--ok); font-weight: 800; }
.row.done { color: var(--ink3); }
.row .pb { margin-left: auto; border: 1.5px solid var(--line); border-radius: 9px; padding: 5px 8px; font-size: 12px; }
.cam { position: absolute; inset: 0; background: #1B1B1E; display: flex; flex-direction: column; color: #fff; }
.cam .feed { flex: 1; position: relative; background: linear-gradient(170deg, #5A5A62, #2C2C31); overflow: hidden; }
.cam .feed .shelves i { background: repeating-linear-gradient(90deg, rgba(255,255,255,.22) 0 16px, rgba(0,0,0,.18) 16px 26px); border-color: rgba(0,0,0,.4); }
.cam .bar { padding: 40px 14px 10px; display: flex; gap: 10px; align-items: flex-start; }
.cam .bar b { display: block; font-size: 16px; }
.cam .bar span { font-size: 12.5px; opacity: .8; }
.cam .foot { padding: 12px 14px 18px; display: flex; flex-direction: column; gap: 8px; }
.sweep { position: absolute; left: 0; right: 0; height: 3px; background: var(--acc); box-shadow: 0 0 18px var(--acc); top: 10%; animation: sweep 2.2s ease-in-out infinite alternate; }
@keyframes sweep { to { top: 88%; } }
.found { position: absolute; left: 50%; top: 40%; width: 26%; height: 26%; border: 3px solid var(--acc); border-radius: 10px; box-shadow: 0 0 0 999px rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; cursor: pointer; animation: pop .5s ease-out; }
.found span { transform: translateY(130%); background: var(--acc); color: #fff; border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 13px; white-space: nowrap; }
@keyframes pop { from { transform: scale(1.4); opacity: 0; } }
.status { background: rgba(255,255,255,.12); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; line-height: 1.4; }
.privacy { font-size: 11.5px; opacity: .75; margin: 0; }
.float { position: absolute; font-size: 22px; font-weight: 800; color: var(--acc); animation: rise 1.4s ease-out both; }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } 30% { opacity: 1; } to { transform: translateY(-26px); opacity: 0; } }
.toast { position: absolute; left: 14px; right: 14px; bottom: 16px; background: var(--ink); color: #fff; border-radius: 14px; padding: 11px 13px; font-size: 13.5px; box-shadow: 0 10px 26px rgba(0,0,0,.25); }
.sheetbg { position: absolute; inset: 0; background: rgba(27,27,30,.5); display: flex; flex-direction: column; justify-content: flex-end; }
.sheet { background: var(--panel); border-radius: 22px 22px 0 0; padding: 16px 16px 22px; display: flex; flex-direction: column; gap: 10px; }
.sheet h3 { margin: 0; font-size: 19px; }
.step { display: flex; gap: 12px; border: 1.5px solid var(--line); border-radius: 14px; padding: 11px; }
.step.on { border: 2px solid var(--acc); background: var(--acc-soft); }
.step .n { width: 30px; height: 30px; border-radius: 999px; background: var(--bg); display: flex; align-items: center; justify-content: center; font-weight: 800; flex-shrink: 0; }
.step.on .n { background: var(--acc); color: #fff; }
.step b { display: block; font-size: 15px; }
.step span { font-size: 13px; color: var(--ink2); }
.big { text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.big .num { font-size: 56px; font-weight: 800; color: var(--acc); line-height: 1; font-variant-numeric: tabular-nums; }
.haul { background: var(--panel); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.haul div { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
.haul .tot { border-top: 1px solid var(--line); padding-top: 6px; font-weight: 800; }
.lvl { height: 10px; border-radius: 999px; background: var(--fill); overflow: hidden; }
.lvl i { display: block; height: 100%; width: var(--w); background: var(--acc); border-radius: 999px; transition: width 1s ease; }
.ms { background: var(--ink); color: #fff; border-radius: 18px; padding: 16px; text-align: center; display: flex; flex-direction: column; gap: 4px; }
.ms b { font-size: 22px; }
.title { margin: 0; font-size: 26px; }
.choice { display: flex; flex-direction: column; gap: 8px; }
.tap { outline: 2px dashed transparent; }
.hint .tap { outline-color: rgba(228,87,46,.55); outline-offset: 2px; }
.viewhud { position: absolute; top: 40px; left: 14px; }
.stores { display: flex; flex-direction: column; gap: 8px; }
.store { background: var(--panel); border: 1.5px solid var(--line); border-radius: 14px; padding: 11px 13px; display: flex; flex-direction: column; gap: 3px; text-align: left; font: 14px var(--font); color: var(--ink); cursor: pointer; }
.store.on { border: 2px solid var(--acc); background: var(--acc-soft); }
.store b { font-size: 16px; display: flex; justify-content: space-between; }
.store .why2 { font-size: 12.5px; color: var(--ink2); }
.badge { font-size: 11px; font-weight: 800; color: var(--acc-ink); background: var(--acc-soft); border-radius: 6px; padding: 2px 6px; }
.pick { background: var(--panel); border-radius: 14px; }
.pick .sec { margin: 0; padding: 10px 12px 2px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink3); }
.pi { display: flex; align-items: center; gap: 10px; padding: 8px 12px; font-size: 14px; }
.pi .bx { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; color: #fff; }
.pi.in .bx { background: var(--acc); border-color: var(--acc); }
.pi .nm { flex: 1; font-weight: 600; min-width: 0; }
.pi .where { font-size: 12px; color: var(--ink3); white-space: nowrap; }
.pi.out .nm { color: var(--ink3); }
.stepper { display: flex; gap: 4px; }
.stepper i { flex: 1; height: 4px; border-radius: 4px; background: var(--fill); }
.stepper i.on { background: var(--acc); }
@media (prefers-reduced-motion: reduce) { .sweep, .found, .float, .lvl i { animation: none; transition: none; } }
button:focus-visible, .flow button:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
</style>

<div class="wrap">
  <div class="phone" id="phone"><div class="screen" id="screen"></div></div>
  <aside class="rail">
    <div class="card-rail">
      <p class="eyebrow" id="where"></p>
      <h1 id="name"></h1>
      <p class="why" id="why"></p>
      <div class="navrow"><button class="btn ghost" id="prev" type="button">‹ Back</button><button class="btn ghost" id="hints" type="button" aria-pressed="false">Show tap targets</button></div>
    </div>
    <div class="card-rail">
      <p class="eyebrow">Jump to a screen</p>
      <div class="flow" id="flow"></div>
    </div>
  </aside>
</div>

<script>
const S = {}; // screen id -> {group, name, why, html, isNew}
const hud = (pts, n) => `<div class="hud"><button class="round tap" data-go="today" aria-label="Leave hunt">‹</button><span class="chip grow">Trader Joe's · Quest</span><span class="chip pts">${pts} pts</span><span class="chip cnt">${n}/8</span></div>`;
const view = (stop, label) => `<div class="view"><div class="shelves"><i></i><i></i><i></i></div><span class="dot" style="right:68px;top:84px">${stop}</span><span class="lbl">${label}</span></div>`;
const cap = `<p class="cap"><span>Real photos from a walk through this store. The orange dot is your next item.</span><button class="link tap" data-go="threed">See it in 3D ›</button></p>`;
const tools = `<div class="tools"><button class="tool">Scan shelf</button><button class="tool">Where am I?</button><button class="tool tap" data-go="nothere">Not here?</button><button class="tool sq tap" data-go="howto" aria-label="How to play">?</button><button class="tool sq" aria-label="Sound">🔈</button></div>`;
const fresh = `<div class="fresh"><div class="shelves" style="inset:10px 8px 10px"><i></i><i></i><i></i></div><span class="blur" title="A shopper, pixelated by SAM"></span><span class="box"></span></div><p class="small">Fresh from a shopper, 6 min ago. People are blurred out; we only keep products.</p>`;
const list = (done) => `<div class="list">${done.map(n => `<div class="row done"><span class="ck">✓</span>${n}<span class="pb">↩ Put back</span></div>`).join("")}<div class="row"><span class="ck"></span>Sourdough Loaf</div><div class="row"><span class="ck"></span>Greek Yogurt</div></div>`;

function def(id, group, name, why, html, isNew) { S[id] = { group, name, why, html, isNew }; }

def("today", "Start", "Today", "Home. The level chip shows progress that only ever goes up. Plan a hunt from your Arya list.",
`<p class="eyebrow" style="margin-top:6px">Wed, Oct 28</p>
<div style="display:flex;justify-content:space-between;align-items:center"><h1 class="title">Today</h1><span class="chip pts">Level 2 · 115 pts</span></div>
<div class="next" style="border-width:1.5px"><p class="k">Your Arya list · 11 items</p><h2>Time for a run?</h2><p class="small">Milk, bananas, sourdough, yogurt, eggs and 6 more.</p><button class="btn primary tap" data-go="pickstore">Plan a hunt</button></div>
<div class="list"><div class="row">Spend this week<span style="margin-left:auto">$84.10</span></div><div class="row">Receipts to return by Fri<span style="margin-left:auto">1</span></div></div>
<p class="small">Tap the orange button to start.</p>`);

def("pickstore", "Plan the trip", "1 · Pick your store", "Store first. Each store shows what you usually buy there, learned from your receipts, so the right one is obvious.",
`<div class="hud"><button class="round tap" data-go="today" aria-label="Back">‹</button><span class="chip grow">Plan a hunt</span></div>
<div class="stepper"><i class="on"></i><i></i><i></i></div>
<h1 class="title">Where are you shopping?</h1>
<div class="stores">
<button class="store on tap" data-go="buildquest"><b>Trader Joe's <span class="badge">7 of your 11</span></b><span class="why2">Usually: milk, sourdough, bananas, spinach, yogurt…</span><span class="why2">Mapped store · real photos</span></button>
<button class="store"><b>Costco <span class="badge">3 of your 11</span></b><span class="why2">Usually: eggs, paper towels, AA batteries</span></button>
<button class="store"><b>Safeway</b><span class="why2">Last trip 3 weeks ago</span></button>
</div>
<button class="link" style="align-self:flex-start">+ Find or add a store</button>
<p class="small">Learned from 24 receipts. Tap Trader Joe's.</p>`, true);

def("buildquest", "Plan the trip", "2 · Move items into the quest", "Your Arya list, sorted for this store. Items you usually buy here start ticked; items you usually get elsewhere stay on your list for that trip. One tap moves anything either way.",
`<div class="hud"><button class="round tap" data-go="pickstore" aria-label="Back">‹</button><span class="chip grow">Trader Joe's</span></div>
<div class="stepper"><i class="on"></i><i class="on"></i><i></i></div>
<h1 class="title" style="font-size:22px">Your quest at Trader Joe's</h1>
<div class="pick">
<p class="sec">Usually bought here · 7</p>
<div class="pi in"><span class="bx">✓</span><span class="nm">Whole Milk</span><span class="where">every week</span></div>
<div class="pi in"><span class="bx">✓</span><span class="nm">Sourdough Loaf</span><span class="where">every week</span></div>
<div class="pi in"><span class="bx">✓</span><span class="nm">Bananas</span></div>
<div class="pi in"><span class="bx">✓</span><span class="nm">Greek Yogurt</span></div>
<div class="pi in"><span class="bx">✓</span><span class="nm">Baby Spinach</span></div>
<div class="pi in"><span class="bx">✓</span><span class="nm">Avocados · Pasta</span><span class="where">2 items</span></div>
<p class="sec">New on your list · 1</p>
<div class="pi in"><span class="bx">✓</span><span class="nm">Oat Milk</span><span class="where">no history yet</span></div>
<p class="sec">Usually from Costco · 3</p>
<div class="pi out"><span class="bx"></span><span class="nm">Pasture Eggs 12 ct</span><span class="where">Costco 5 of 6</span></div>
<div class="pi out"><span class="bx"></span><span class="nm">Paper Towels · AA Batteries</span><span class="where">Costco</span></div>
</div>
<button class="btn primary tap" data-go="checklist">Start quest · 8 items</button>
<p class="small">The 3 Costco items stay on your Arya list for that trip.</p>`, true);

def("checklist", "Plan the trip", "3 · Check my list (only if needed)", "Shown only when Arya has a question, like which milk. With nothing to ask, the quest starts straight away.",
`<div class="hud"><button class="round tap" data-go="buildquest" aria-label="Back">‹</button><span class="chip grow">Trader Joe's</span></div>
<div class="stepper"><i class="on"></i><i class="on"></i><i class="on"></i></div>
<h1 class="title" style="font-size:22px">One quick question</h1>
<div class="next" style="border-width:1.5px"><p class="k">Oat Milk</p><h2 style="font-size:17px">Which one?</h2>
<div class="choice"><button class="btn ghost tap" data-go="howto">TJ's Oat Beverage 64 oz</button><button class="btn ghost tap" data-go="howto">Oatly Barista 32 oz</button></div></div>
<button class="btn primary tap" data-go="howto">Skip, start the quest</button>`, true);

def("howto", "Start", "How to play", "Shown once, on the first Quest hunt on a phone. The ? in the tools row opens it again. Three steps, no clock, no way to lose.",
`${hud(0, 0)}${view(1, "Store photos")}
<div class="sheetbg"><div class="sheet">
<div style="display:flex;justify-content:space-between;align-items:center"><p class="eyebrow">How to play · 3 steps</p><button class="link tap" data-go="ready">Skip</button></div>
<div class="step on"><span class="n">1</span><div><b>Find it</b><span>The orange card shows your next item. Lost? Tap Find it for me and point your camera at the shelf.</span></div></div>
<div class="step"><span class="n">2</span><div><b>Grab it</b><span>In your cart? Tap Grab: +10. Shelf empty? Tap Not here? to warn the next shopper.</span></div></div>
<div class="step"><span class="n">3</span><div><b>Snap the receipt</b><span>Tap Finish and photograph the receipt: +50, and your points bank.</span></div></div>
<button class="btn primary tap" data-go="ready">Got it — let's hunt</button>
</div></div>`);

def("ready", "Hunt", "Hunt ready", "One store view, picked by the store: real photos for a mapped store, shelf cards for any other. Nothing to choose.",
`${hud(0, 0)}${view(1, "Store photos")}${cap}${tools}
<div class="next"><p class="k">Ready when you are</p><h2>8 items</h2><p class="shelf">First stop: Whole Milk.</p><button class="btn primary tap" data-go="hunt">Start the hunt</button></div>
${list([])}`);

def("hunt", "Hunt", "Next item, with a fresh photo", "The card shows the next item. If a shopper scanned it recently, their photo shows with the item boxed and any people blurred by Meta SAM. Find it for me sits under Grab.",
`${hud(20, 2)}${view(3, "Store photos")}${cap}${tools}
<div class="next"><p class="k">Suggested next — grab any stop</p><h2>Sourdough Loaf</h2><p class="shelf">Bakery · aisle 3, left</p>${fresh}
<button class="btn primary tap" data-go="grabbed">Grab · Sourdough Loaf</button>
<button class="btn ghost tap" data-go="scan">🔍 Find it for me</button></div>
${list(["Whole Milk", "Bananas"])}`, true);

def("threed", "Hunt", "See it in 3D", "For the curious, and the judges: the 3D scan of the store, one orange target. Back returns to the photos. The list and grabs never change.",
`${hud(20, 2)}<div class="view" style="height:300px;background:radial-gradient(circle at 60% 40%, #8C8C96, #2C2C31)"><span class="dot" style="left:58%;top:38%">3</span><span class="lbl">3D scan</span></div>
<p class="cap"><span>The 3D scan of this store, made from the walk video.</span><button class="link tap" data-go="hunt">‹ Back to the photos</button></p>${tools}
<div class="next"><p class="k">Suggested next</p><h2>Sourdough Loaf</h2><button class="btn primary">Grab · Sourdough Loaf</button></div>`);

def("scan", "Find it for me", "Scanning for one item", "The camera opens aimed at the next item only. SAM 3.1 boxes candidates and Muse Spark checks each one, so a highlight is never a guess.",
`<div class="cam"><div class="bar"><div style="flex:1"><b>Find it for me</b><span>Looking for Sourdough Loaf. Hold the phone up to the shelf.</span></div><button class="round tap" data-go="hunt" aria-label="Close">✕</button></div>
<div class="feed"><div class="shelves"><i></i><i></i><i></i></div><div class="sweep"></div></div>
<div class="foot"><div class="status">Scanning… about 5 seconds a look.</div>

const GROUPS = ["Start", "Plan the trip", "Hunt", "Find it for me", "After"];
const order = Object.keys(S).sort((a, b) => GROUPS.indexOf(S[a].group) - GROUPS.indexOf(S[b].group));
let cur = null; const back = [];
function go(id, push = true) {
  if (!S[id]) id = "today";
  if (push && cur && cur !== id) back.push(cur);
  cur = id;
  const s = S[id];
  document.getElementById("screen").innerHTML = s.html;
  document.getElementById("screen").scrollTop = 0;
  document.getElementById("where").textContent = `${s.group} · ${order.indexOf(id) + 1} of ${order.length}`;
  document.getElementById("name").innerHTML = s.name + (s.isNew ? '<span class="new">NEW</span>' : "");
  document.getElementById("why").textContent = s.why;
  document.querySelectorAll(".flow button[data-id]").forEach(b => b.classList.toggle("on", b.dataset.id === id));
  if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
  if (id === "banked") {
    const el = document.getElementById("countup"); let n = 0;
    const t = setInterval(() => { n = Math.min(155, n + 7); el.textContent = n; if (n >= 155) clearInterval(t); }, 30);
    requestAnimationFrame(() => setTimeout(() => document.getElementById("lvlbar").style.setProperty("--w", "90%"), 60));
  }
}
const flow = document.getElementById("flow"); let g = "";
order.forEach(id => {
  if (S[id].group !== g) { g = S[id].group; flow.insertAdjacentHTML("beforeend", `<p class="eyebrow grp">${g}</p>`); }
  flow.insertAdjacentHTML("beforeend", `<button type="button" data-id="${id}">${S[id].name}${S[id].isNew ? '<span class="new">NEW</span>' : ""}</button>`);
});
flow.addEventListener("click", e => { const b = e.target.closest("button[data-id]"); if (b) go(b.dataset.id); });
document.getElementById("screen").addEventListener("click", e => { const t = e.target.closest("[data-go]"); if (t) go(t.dataset.go); });
document.getElementById("prev").addEventListener("click", () => { if (back.length) go(back.pop(), false); });
document.getElementById("hints").addEventListener("click", e => { const on = document.getElementById("phone").classList.toggle("hint"); e.currentTarget.setAttribute("aria-pressed", on); e.currentTarget.textContent = on ? "Hide tap targets" : "Show tap targets"; });
window.addEventListener("hashchange", () => { const id = location.hash.slice(1); if (id !== cur) go(id); });
go(location.hash.slice(1) || "today", false);
</script>
